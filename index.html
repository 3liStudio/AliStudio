<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ali Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080c;--bg2:#0e1016;--ivory:#f1e6c8;--gold:#d8b46c;--gold2:#a88442;--text:#ece6d6;--muted:#a59f90;--glass:rgba(22,24,32,.55);--line:rgba(216,180,108,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.8;overflow-x:hidden;
background-image:radial-gradient(900px 500px at 70% -10%,rgba(216,180,108,.13),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(216,180,108,.07),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 5vw;background:rgba(7,8,12,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:.04em}
.brand img{width:38px;height:38px}
nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.95rem;transition:.2s}
nav a:hover,nav a.on{color:var(--ivory);background:rgba(216,180,108,.12)}
header nav{order:2}
.sw{order:3;position:relative;direction:ltr;flex:none}
.sw .cur{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.4);color:var(--gold);font:inherit;font-size:.78rem;font-weight:600;letter-spacing:.06em;line-height:1;cursor:pointer;transition:.2s}
.sw .cur:hover,.sw .cur[aria-expanded=true]{border-color:var(--gold);color:var(--ivory)}
.sw .cur svg{width:9px;height:6px;transition:transform .2s}
.sw .cur[aria-expanded=true] svg{transform:rotate(180deg)}
.menu{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:64px;z-index:70;list-style:none;margin:0;padding:4px;border:1px solid var(--line);border-radius:14px;background:rgba(14,16,22,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.menu[hidden]{display:none}
.menu button{width:100%;min-height:34px;border:0;border-radius:10px;background:none;color:var(--muted);font:inherit;font-size:.78rem;font-weight:600;letter-spacing:.06em;cursor:pointer}
.menu button:hover{color:var(--ivory);background:rgba(216,180,108,.1)}
.menu button[aria-selected=true]{color:var(--gold);background:rgba(216,180,108,.16)}

main{min-height:70vh}
.view{display:none;padding:0 5vw}.view.on{display:block;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{display:grid;place-items:center;text-align:center;min-height:calc(100svh - 180px);padding:48px 0;gap:18px;perspective:900px}
.hero img{width:min(46vw,260px);height:auto;filter:drop-shadow(0 24px 40px rgba(216,180,108,.25));animation:float 6s ease-in-out infinite;transform-style:preserve-3d}
@keyframes float{50%{transform:translateY(-10px) rotateY(10deg)}}
h1{font-size:clamp(2.2rem,8vw,4.4rem);margin:0;line-height:1.15;font-weight:800;letter-spacing:.02em;background:linear-gradient(180deg,var(--ivory),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:clamp(1rem,3.4vw,1.25rem);margin:0;max-width:36ch}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;text-decoration:none;font:inherit;font-weight:600;padding:11px 26px;border-radius:999px;border:1px solid var(--gold);cursor:pointer;transition:.2s}
.btn.p{background:linear-gradient(135deg,var(--ivory),var(--gold));color:#14110a;border-color:transparent}
.btn.s{background:transparent;color:var(--ivory)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(216,180,108,.2)}
h2{font-size:clamp(1.6rem,5vw,2.4rem);margin:48px 0 8px;color:var(--ivory)}
.lead{color:var(--muted);max-width:60ch;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;padding-bottom:40px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(241,230,200,.1);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px) rotateX(2deg);border-color:var(--gold2)}
.shot{aspect-ratio:16/10;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.85rem;margin-bottom:14px;background:rgba(0,0,0,.3)}
.card h3{margin:0 0 4px;color:var(--ivory)}
.card p{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.badge{display:inline-block;font-size:.8rem;padding:2px 12px;border-radius:999px;border:1px solid var(--line);color:var(--gold)}
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding-bottom:50px;max-width:980px}
.about .card{padding:24px 26px}
.about .card h3{font-size:1.25rem;margin:0 0 14px;color:var(--gold)}
.about .card p{color:var(--text);font-size:1rem;line-height:1.95;margin:0}
.about .card p:last-child{margin:0}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding-bottom:50px}
label{display:block;font-size:.9rem;color:var(--muted);margin:14px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--text);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
input:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{min-height:130px;resize:vertical}
#msg{min-height:1.6em;margin:12px 0 0;font-size:.95rem}
#msg.err{color:#ff9d8a}#msg.ok{color:var(--gold)}
.social{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.social a{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(216,180,108,.06);color:var(--gold);text-decoration:none;font-weight:600;font-size:.9rem;line-height:1;white-space:nowrap;transition:.2s}
#fsocial a{min-height:36px;padding:0 12px;border-color:transparent;background:none;color:var(--muted);font-weight:400}
#fsocial a:hover{color:var(--ivory);border-color:var(--line);transform:none}
.social a:hover{color:var(--ivory);border-color:var(--gold);transform:translateY(-2px)}
.social a svg{width:17px;height:17px;flex:0 0 17px;fill:currentColor;display:block}
.note{color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
footer{border-top:1px solid var(--line);padding:30px 5vw 24px;text-align:center;color:var(--muted)}
footer nav{justify-content:center}
.copy{font-size:.78rem;opacity:.65;margin:14px 0 0}
#ov{position:fixed;inset:0;z-index:100;pointer-events:none;visibility:hidden;overflow:hidden}
#gate{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:radial-gradient(circle,#000 62%,#050608);box-shadow:0 0 0 2px var(--gold),0 0 40px 6px rgba(216,180,108,.55),inset 0 0 30px rgba(216,180,108,.25);transform:scale(0)}
@media(prefers-reduced-motion:reduce){.hero img{animation:none}.view.on{animation:none}*{transition:none!important}}
@media(max-width:560px){header{flex-wrap:wrap;padding:8px 4vw;row-gap:4px}.brand{flex:1}.sw{order:1}header nav{order:2;width:100%;justify-content:center}nav a{padding:5px 9px;font-size:.88rem}}
</style>
</head>

var cur="home",busy=false,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function show(id){

function go(id,push){
  if(id==cur||busy||!$("#"+id))return;
  if(push!==false)history.pushState(null,"","#"+id);
  if(reduce||!Element.prototype.animate){show(id);return}

}
